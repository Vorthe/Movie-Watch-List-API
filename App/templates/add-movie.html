{% include "layout.html" %}

<div class="container">
    <div class="card">
        <div class="card-header">
            Make a New Movie
        </div>
        <div class="card-body">
            <form id="movieForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" class="form-control" name="title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea class="form-control" rows="3" name="description" required></textarea>
                </div>
                <div class="form-group">
                    <label>Rating</label>
                    <select class="form-control" name="rating" id="">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Add New Movie</button>
                <a href="/movies/movie-page" class="btn btn-success">Back</a>
            </form>
        </div>
    </div>
</div>
