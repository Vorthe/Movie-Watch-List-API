services:

  db:
    image: postgres:16
    container_name: moviewatchlist_postgres

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .

    container_name: moviewatchlist_app

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8001:8000"

    volumes:
      - .:/app

    command: >
      sh -c "alembic upgrade head &&
             uvicorn App.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
